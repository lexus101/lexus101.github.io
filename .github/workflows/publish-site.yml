name: Publish portfolio text patch

on:
  push:
    branches: [main]
    paths:
      - ".publish/patch.zip"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply portfolio patch
        run: |
          unzip -o .publish/patch.zip -d .
          rm -rf .publish

      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Polish portfolio typography and spacing"
          git push
