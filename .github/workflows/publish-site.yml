name: Publish portfolio site

on:
  push:
    branches: [main]
    paths:
      - ".publish/**"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild portfolio bundle
        run: |
          cat .publish/chunk-* > /tmp/site.zip
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          unzip -q /tmp/site.zip -d /tmp/portfolio-site
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.publish' /tmp/portfolio-site/leo-portfolio-v10/ ./
          rm -rf .publish

      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Publish portfolio v1.0"
          git push
